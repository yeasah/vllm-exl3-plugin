<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Cat body -->
  <ellipse cx="100" cy="130" rx="60" ry="50" fill="#FFD166" />
  
  <!-- Head -->
  <circle cx="100" cy="70" r="50" fill="#FFD166" />
  
  <!-- Ears -->
  <polygon points="70,50 80,20 90,50" fill="#FFA500" />
  <polygon points="130,50 140,20 150,50" fill="#FFA500" />
  
  <!-- Inner ears -->
  <circle cx="80" cy="40" r="10" fill="#FFD166" />
  <circle cx="120" cy="40" r="10" fill="#FFD166" />
  
  <!-- Eyes -->
  <circle cx="80" cy="65" r="12" fill="white" />
  <circle cx="120" cy="65" r="12" fill="white" />
  <circle cx="80" cy="65" r="5" fill="black" />
  <circle cx="120" cy="65" r="5" fill="black" />
  
  <!-- Nose -->
  <polygon points="100,80 90,95 110,95" fill="#FF6B6B" />
  
  <!-- Mouth -->
  <path d="M90,105 Q100,115 110,105" stroke="#FF6B6B" stroke-width="2" fill="none" />
  
  <!-- Whiskers -->
  <line x1="80" y1="90" x2="60" y2="90" stroke="black" stroke-width="1" />
  <line x1="80" y1="95" x2="60" y2="98" stroke="black" stroke-width="1" />
  <line x1="80" y1="100" x2="60" y2="106" stroke="black" stroke-width="1" />
  <line x1="120" y1="90" x2="140" y2="90" stroke="black" stroke-width="1" />
  <line x1="120" y1="95" x2="140" y2="98" stroke="black" stroke-width="1" />
  <line x1="120" y1="100" x2="140" y2="106" stroke="black" stroke-width="1" />
  
  <!-- Paws -->
  <ellipse cx="70" cy="160" rx="15" ry="10" fill="#FFD166" />
  <ellipse cx="130" cy="160" rx="15" ry="10" fill="#FFD166" />
  
  <!-- Tail -->
  <path d="M160,130 C180,120 190,130 180,150" stroke="#FFD166" stroke-width="15" fill="none" />
</svg>