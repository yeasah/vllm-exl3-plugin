<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Cat body -->
  <circle cx="100" cy="130" r="50" fill="#D2691E"/>
  
  <!-- Cat head -->
  <circle cx="100" cy="80" r="45" fill="#D2691E"/>
  
  <!-- Ears -->
  <circle cx="70" cy="50" r="20" fill="#D2691E"/>
  <circle cx="130" cy="50" r="20" fill="#D2691E"/>
  
  <!-- Inner ears -->
  <circle cx="70" cy="50" r="10" fill="#CD853F"/>
  <circle cx="130" cy="50" r="10" fill="#CD853F"/>
  
  <!-- Eyes -->
  <circle cx="85" cy="75" r="8" fill="white"/>
  <circle cx="115" cy="75" r="8" fill="white"/>
  <circle cx="85" cy="75" r="4" fill="black"/>
  <circle cx="115" cy="75" r="4" fill="black"/>
  
  <!-- Nose -->
  <polygon points="100,85 95,92 105,92" fill="#FFB6C1"/>
  
  <!-- Mouth -->
  <path d="M 95 95 Q 100 100 105 95" stroke="#FFB6C1" stroke-width="2" fill="none"/>
  
  <!-- Whiskers -->
  <line x1="70" y1="95" x2="95" y2="95" stroke="#8B4513" stroke-width="1"/>
  <line x1="70" y1="100" x2="95" y2="100" stroke="#8B4513" stroke-width="1"/>
  <line x1="70" y1="105" x2="95" y2="105" stroke="#8B4513" stroke-width="1"/>
  <line x1="105" y1="95" x2="130" y2="95" stroke="#8B4513" stroke-width="1"/>
  <line x1="105" y1="100" x2="130" y2="100" stroke="#8B4513" stroke-width="1"/>
  <line x1="105" y1="105" x2="130" y2="105" stroke="#8B4513" stroke-width="1"/>
  
  <!-- Paws -->
  <ellipse cx="60" cy="135" rx="12" ry="8" fill="#D2691E"/>
  <ellipse cx="140" cy="135" rx="12" ry="8" fill="#D2691E"/>
  <ellipse cx="100" cy="165" rx="15" ry="10" fill="#D2691E"/>
</svg>
