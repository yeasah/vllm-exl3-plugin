<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background (Optional) -->
  <rect width="200" height="200" fill="#fdfcf0" rx="20" />

  <!-- Ears -->
  <path d="M60 80 L40 30 L90 60 Z" fill="#7a7a7a" /> <!-- Left Ear -->
  <path d="M140 80 L160 30 L110 60 Z" fill="#7a7a7a" /> <!-- Right Ear -->
  
  <!-- Head -->
  <circle cx="100" cy="100" r="60" fill="#a0a0a0" />
  
  <!-- Eyes -->
  <circle cx="80" cy="90" r="6" fill="#333" />  <!-- Left Eye -->
  <circle cx="120" cy="90" r="6" fill="#333" /> <!-- Right Eye -->
  
  <!-- Nose -->
  <path d="M95 105 Q100 110 105 105" stroke="#ff9999" stroke-width="3" fill="none" stroke-linecap="round" />
  
  <!-- Mouth (W shape) -->
  <path d="M90 115 Q100 125 110 115" stroke="#333" stroke-width="2" fill="none" />
  
  <!-- Whiskers -->
  <!-- Left side -->
  <line x1="70" y1="110" x2="30" y2="100" stroke="#333" stroke-width="1" />
  <line x1="70" y1="120" x2="30" y2="130" stroke="#333" stroke-width="1" />
  <!-- Right side -->
  <line x1="130" y1="110" x2="170" y2="100" stroke="#333" stroke-width="1" />
  <line x1="130" y1="120" x2="170" y2="130" stroke="#333" stroke-width="1" />
</svg>