<svg width="400" height="350" viewBox="0 0 400 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="350" fill="#f7eeb9"/>
  
  <!-- Ground/Snow pattern -->
  <path d="M100,320 L140,330 L160,310 L180,335 L200,315 L220,340 L240,310 L260,335 L280,315 L300,340 L320,310 L340,335 L360,315 L380,340 Z" fill="#dcdde0"/>
  <path d="M250,300 L300,295 L310,310 L320,290 L330,305 L340,285 L350,300 L360,280 L370,305 L380,280 Z" fill="#dddfe8"/>

  <!-- Body -->
  <ellipse cx="200" cy="200" rx="60" ry="65" fill="#ffa7cc" transform="rotate(-5 200 200)"/>
  <circle cx="200" cy="200" r="20" fill="#fff"/>
  
  <!-- Front Paws -->
  <circle cx="145" cy="235" r="10" fill="#fff" stroke="#aaa" stroke-width="2"/>
  <circle cx="155" cy="240" r="12" fill="#fff" stroke="#aaa" stroke-width="2"/>
  
  <circle cx="255" cy="235" r="10" fill="#fff" stroke="#aaa" stroke-width="2"/>
  <circle cx="245" cy="240" r="12" fill="#fff" stroke="#aaa" stroke-width="2"/>

  <!-- Head -->
  <circle cx="200" cy="130" r="55" fill="#ffadc4"/>
  <circle cx="200" cy="130" r="25" fill="white" opacity="0.9"/>

  <!-- Eyes -->
  <ellipse cx="160" cy="145" rx="9" ry="10" fill="none" stroke="#333" stroke-width="2.5" transform="rotate(40 160 145)"/>
  <ellipse cx="160" cy="145" rx="9" ry="10" fill="none" stroke="#333" stroke-width="2.5" transform="rotate(-40 160 145)"/>
  
  <ellipse cx="175" cy="135" rx="6" ry="6" fill="black"/>
  <ellipse cx="185" cy="135" rx="6" ry="6" fill="black"/>
  
  <ellipse cx="135" cy="155" rx="6" ry="6" fill="black"/>
  <ellipse cx="125" cy="155" rx="6" ry="6" fill="black"/>

  <!-- Nose and Mouth -->
  <ellipse cx="200" cy="165" rx="4" ry="5" fill="#ff6ec3"/>
  <path d="M208 165 Q200 170 192 165" fill="#ff6ec3" stroke="#ff6ec3" stroke-width="1"/>
  
  <!-- Ears -->
  <ellipse cx="125" cy="90" rx="8" ry="20" fill="#ffadac" stroke="#ff6ec3" stroke-width="2"/>
  <ellipse cx="255" cy="90" rx="8" ry="20" fill="#ffadac" stroke="#ff6ec3" stroke-width="2"/>
  <path d="M100 90 C80 60 120 60 140 90 Z" fill="#ffadac"/>
  <path d="M300 90 C320 60 280 60 260 90 Z" fill="#ffadac"/>

  <!-- White Face Markings (Mustache/Face) -->
  <ellipse cx="200" cy="160" rx="15" ry="5" fill="rgba(255,255,255,0.4)"/>
  <circle cx="200" cy="155" r="5" fill="white"/>

  <!-- Whiskers -->
  <line x1="200" y1="130" x2="200" y2="110" stroke="#ffb6bf" stroke-width="1"/>
  <line x1="200" y1="130" x2="190" y2="110" stroke="#ffb6bf" stroke-width="1"/>
  <line x1="200" y1="130" x2="210" y2="110" stroke="#ffb6bf" stroke-width="1"/>
  
  <line x1="200" y1="130" x2="210" y2="150" stroke="#ffb6bf" stroke-width="1"/>
  <line x1="200" y1="130" x2="190" y2="150" stroke="#ffb6bf" stroke-width="1"/>

  <!-- Tail -->
  <path d="M230 140 Q240 110 250 100 T280 110 T230 140" fill="none" stroke="#ff6ec3" stroke-width="8" stroke-linecap="round"/>
  <circle cx="250" cy="100" r="3" fill="#fff" stroke="#ff6ec3" stroke-width="2"/>

  <!-- Fluffy Back/Pelage -->
  <ellipse cx="200" cy="210" rx="35" ry="20" fill="none" stroke="#ffadac" stroke-width="1"/>

</svg>