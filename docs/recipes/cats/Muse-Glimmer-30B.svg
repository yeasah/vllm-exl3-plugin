<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400">
  <!-- Body -->
  <ellipse cx="100" cy="140" rx="60" ry="45" fill="#FFD8B8" stroke="#E5A884" stroke-width="3"/>
  <!-- Tail -->
  <path d="M 40 130 C 20 130, 10 150, 30 170 C 50 190, 70 170, 60 140" fill="none" stroke="#FFD8B8" stroke-width="14" stroke-linecap="round"/>
  
  <!-- Head -->
  <ellipse cx="100" cy="80" rx="55" ry="50" fill="#FFD8B8" stroke="#E5A884" stroke-width="3"/>
  <!-- Ears -->
  <polygon points="70,30 55,70 85,60" fill="#FFC9A3" stroke="#E5A884" stroke-width="3"/>
  <polygon points="130,30 145,70 115,60" fill="#FFC9A3" stroke="#E5A884" stroke-width="3"/>
  <!-- Inner ears -->
  <polygon points="70,40 62,60 78,55" fill="#FF8A8A"/>
  <polygon points="130,40 138,60 122,55" fill="#FF8A8A"/>

  <!-- Eyes -->
  <ellipse cx="80" cy="75" rx="10" ry="14" fill="white" stroke="#333" stroke-width="2"/>
  <ellipse cx="120" cy="75" rx="10" ry="14" fill="white" stroke="#333" stroke-width="2"/>
  <circle cx="80" cy="70" r="5" fill="#333"/>
  <circle cx="120" cy="70" r="5" fill="#333"/>
  <circle cx="82" cy="68" r="2" fill="white"/>
  <circle cx="122" cy="68" r="2" fill="white"/>

  <!-- Nose -->
  <ellipse cx="100" cy="100" rx="6" ry="5" fill="#FF8A8A"/>
  <path d="M 100 104 L 100 112" stroke="#E5A884" stroke-width="2" stroke-linecap="round"/>

  <!-- Mouth -->
  <path d="M 90 108 Q 100 115 110 108" fill="none" stroke="#E5A884" stroke-width="2" stroke-linecap="round"/>

  <!-- Whiskers -->
  <g stroke="#E5A884" stroke-width="1.5" stroke-linecap="round">
    <line x1="60" y1="95" x2="35" y2="90"/>
    <line x1="60" y1="100" x2="35" y2="100"/>
    <line x1="60" y1="105" x2="35" y2="110"/>
    <line x1="140" y1="95" x2="165" y2="90"/>
    <line x1="140" y1="100" x2="165" y2="100"/>
    <line x1="140" y1="105" x2="165" y2="110"/>
  </g>

  <!-- Cheek blush -->
  <ellipse cx="60" cy="110" rx="10" ry="7" fill="#FFB5B5" opacity="0.6"/>
  <ellipse cx="140" cy="110" rx="10" ry="7" fill="#FFB5B5" opacity="0.6"/>
</svg>