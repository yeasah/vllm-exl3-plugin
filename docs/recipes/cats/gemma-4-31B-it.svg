<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="200" cy="200" r="180" fill="#fdf2f8" />

  <!-- Tail -->
  <path d="M 260 280 Q 320 280 310 220" stroke="#b5b5b5" stroke-width="20" fill="none" stroke-linecap="round" />

  <!-- Body -->
  <ellipse cx="200" cy="250" rx="70" ry="60" fill="#d1d1d1" />

  <!-- Head -->
  <circle cx="200" cy="160" r="60" fill="#d1d1d1" />

  <!-- Ears -->
  <polygon points="150,130 170,100 180,140" fill="#d1d1d1" />
  <polygon points="250,130 230,100 220,140" fill="#d1d1d1" />
  
  <!-- Inner Ears (Pink) -->
  <polygon points="155,130 170,110 175,135" fill="#ffb7c5" />
  <polygon points="245,130 230,110 225,135" fill="#ffb7c5" />

  <!-- Eyes -->
  <circle cx="180" cy="155" r="6" fill="#333" />
  <circle cx="220" cy="155" r="6" fill="#333" />
  <!-- Eye highlights -->
  <circle cx="182" cy="153" r="2" fill="white" />
  <circle cx="222" cy="153" r="2" fill="white" />

  <!-- Nose & Mouth -->
  <circle cx="200" cy="170" r="4" fill="#ffb7c5" />
  <path d="M 195 175 Q 200 182 205 175" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Paws -->
  <circle cx="170" cy="290" r="12" fill="#c0c0c0" />
  <circle cx="230" cy="290" r="12" fill="#c0c0c0" />

  <!-- Blushed Cheeks -->
  <circle cx="165" cy="175" r="8" fill="#ffb7c5" opacity="0.6" />
  <circle cx="235" cy="175" r="8" fill="#ffb7c5" opacity="0.6" />
</svg>