<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle for a clean look -->
  <circle cx="100" cy="100" r="90" fill="#fdfdfd" />

  <!-- Ears -->
  <polygon points="60,70 70,40 90,60" fill="#B0B0B0" />
  <polygon points="140,70 130,40 110,60" fill="#B0B0B0" />

  <!-- Face/Head -->
  <ellipse cx="100" cy="85" rx="50" ry="40" fill="#C0C0C0" />

  <!-- Eyes -->
  <circle cx="80" cy="80" r="5" fill="#333" />
  <circle cx="120" cy="80" r="5" fill="#333" />
  
  <!-- Eye Highlights -->
  <circle cx="82" cy="78" r="2" fill="white" />
  <circle cx="122" cy="78" r="2" fill="white" />

  <!-- Nose -->
  <ellipse cx="100" cy="90" rx="4" ry="3" fill="#FFB6C1" />

  <!-- Mouth -->
  <path d="M 95 95 Q 100 100 105 95" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Blushes -->
  <circle cx="70" cy="92" r="5" fill="#FFC0CB" opacity="0.6" />
  <circle cx="130" cy="92" r="5" fill="#FFC0CB" opacity="0.6" />

  <!-- Paws -->
  <ellipse cx="80" cy="120" rx="10" ry="7" fill="#B0B0B0" />
  <ellipse cx="120" cy="120" rx="10" ry="7" fill="#B0B0B0" />

  <!-- Tail -->
  <path d="M 130 110 Q 150 110 150 90" stroke="#C0C0C0" stroke-width="8" fill="none" stroke-linecap="round" />
</svg>
