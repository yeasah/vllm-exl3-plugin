<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="A cute cartoon cat sitting with big eyes and pink cheeks">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EDF7FF"/>
      <stop offset="55%" stop-color="#FBEAF4"/>
      <stop offset="100%" stop-color="#FFF3E4"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBD29B"/>
      <stop offset="100%" stop-color="#F6BC78"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="400" height="400" rx="34" fill="url(#bg)"/>

  <!-- sparkles -->
  <g fill="#FFC2D6" opacity="0.9">
    <path d="M 62,74 Q 64,84 74,86 Q 64,88 62,98 Q 60,88 50,86 Q 60,84 62,74 Z"/>
    <path d="M 336,116 Q 337.5,123 344,124.5 Q 337.5,126 336,133 Q 334.5,126 328,124.5 Q 334.5,123 336,116 Z"/>
  </g>
  <g fill="#BFE6DC" opacity="0.9">
    <path d="M 54,286 Q 56,295 65,297 Q 56,299 54,308 Q 52,299 43,297 Q 52,295 54,286 Z"/>
    <circle cx="348" cy="318" r="5"/>
  </g>

  <!-- tail -->
  <path d="M 280,318 C 348,344 372,262 322,234"
        fill="none" stroke="url(#fur)" stroke-width="18" stroke-linecap="round"/>

  <!-- body -->
  <ellipse cx="200" cy="302" rx="94" ry="76" fill="url(#fur)"/>
  <ellipse cx="200" cy="318" rx="52" ry="44" fill="#FFF3E0" opacity="0.95"/>

  <!-- paws -->
  <g>
    <ellipse cx="152" cy="356" rx="25" ry="16" fill="#FFF3E0"/>
    <ellipse cx="248" cy="356" rx="25" ry="16" fill="#FFF3E0"/>
    <g stroke="#EABB8C" stroke-width="2" stroke-linecap="round" fill="none">
      <path d="M 144,348 v 9"/>
      <path d="M 152,346 v 10"/>
      <path d="M 160,348 v 9"/>
      <path d="M 240,348 v 9"/>
      <path d="M 248,346 v 10"/>
      <path d="M 256,348 v 9"/>
    </g>
  </g>

  <!-- ears (behind head) -->
  <g stroke-linejoin="round">
    <path d="M 118,140 L 112,48 L 190,96 Z" fill="url(#fur)" stroke="url(#fur)" stroke-width="8"/>
    <path d="M 282,140 L 288,48 L 210,96 Z" fill="url(#fur)" stroke="url(#fur)" stroke-width="8"/>
    <path d="M 128,120 L 125,69 L 167,95 Z" fill="#FFB3C9"/>
    <path d="M 272,120 L 275,69 L 233,95 Z" fill="#FFB3C9"/>
  </g>

  <!-- head -->
  <ellipse cx="200" cy="172" rx="90" ry="82" fill="url(#fur)"/>

  <!-- blush -->
  <ellipse cx="148" cy="206" rx="17" ry="10" fill="#FFA3B8" opacity="0.55"/>
  <ellipse cx="252" cy="206" rx="17" ry="10" fill="#FFA3B8" opacity="0.55"/>

  <!-- eyes -->
  <g>
    <circle cx="170" cy="176" r="16" fill="#3B3330"/>
    <circle cx="230" cy="176" r="16" fill="#3B3330"/>
    <circle cx="164" cy="169" r="5.5" fill="#FFFFFF"/>
    <circle cx="224" cy="169" r="5.5" fill="#FFFFFF"/>
    <circle cx="176" cy="184" r="2.6" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="236" cy="184" r="2.6" fill="#FFFFFF" opacity="0.85"/>
  </g>

  <!-- nose -->
  <path d="M 190,200 Q 200,195 210,200 Q 205,210 200,211 Q 195,210 190,200 Z" fill="#FF8FA3"/>

  <!-- mouth -->
  <g stroke="#8A6A5B" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M 200,211 Q 195,222 185,219"/>
    <path d="M 200,211 Q 205,222 215,219"/>
  </g>

  <!-- whiskers -->
  <g stroke="#E8B27E" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M 120,182 Q 140,180 160,184"/>
    <path d="M 118,198 Q 140,198 162,198"/>
    <path d="M 122,214 Q 142,216 160,210"/>
    <path d="M 280,182 Q 260,180 240,184"/>
    <path d="M 282,198 Q 260,198 238,198"/>
    <path d="M 278,214 Q 258,216 240,210"/>
  </g>
</svg>
