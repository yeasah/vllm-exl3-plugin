<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="fur" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#f6bd5c"/>
      <stop offset="100%" stop-color="#d98b34"/>
    </radialGradient>
    <radialGradient id="iris" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#7fbf69"/>
      <stop offset="60%" stop-color="#4a8f55"/>
      <stop offset="100%" stop-color="#2e6b3a"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="20" fill="#fef6fb"/>

  <!-- Tail -->
  <path d="M 300 345 Q 360 350 352 295 Q 350 255 382 235"
        fill="none" stroke="#d98b34" stroke-width="22" stroke-linecap="round"/>

  <!-- Body -->
  <ellipse cx="200" cy="320" rx="95" ry="80" fill="url(#fur)"/>

  <!-- Paws -->
  <ellipse cx="155" cy="388" rx="30" ry="18" fill="#e29950"/>
  <ellipse cx="245" cy="388" rx="30" ry="18" fill="#e29950"/>

  <!-- Head -->
  <ellipse cx="200" cy="160" rx="98" ry="90" fill="url(#fur)"/>

  <!-- Ears (outer + inner) -->
  <polygon points="135,100 170,155 112,158" fill="#d98b34"/>
  <polygon points="150,115 165,145 138,150" fill="#f6c9bf"/>
  <polygon points="265,100 230,155 288,158" fill="#d98b34"/>
  <polygon points="250,115 235,145 262,150" fill="#f6c9bf"/>

  <!-- Blush cheeks -->
  <ellipse cx="128" cy="190" rx="22" ry="14" fill="#ffb3c1" opacity="0.5"/>
  <ellipse cx="272" cy="190" rx="22" ry="14" fill="#ffb3c1" opacity="0.5"/>

  <!-- Tabby "M" forehead marking -->
  <path d="M 172 120 L 185 140 L 200 130 L 215 140 L 228 120"
        fill="none" stroke="#b8712b" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Eyes -->
  <g>
    <ellipse cx="155" cy="160" rx="30" ry="30" fill="#ffffff"/>
    <ellipse cx="245" cy="160" rx="30" ry="30" fill="#ffffff"/>
    <ellipse cx="155" cy="160" rx="22" ry="22" fill="url(#iris)"/>
    <ellipse cx="245" cy="160" rx="22" ry="22" fill="url(#iris)"/>
    <ellipse cx="155" cy="160" rx="10" ry="18" fill="#2b1c10"/>
    <ellipse cx="245" cy="160" rx="10" ry="18" fill="#2b1c10"/>
    <circle cx="150" cy="153" r="6" fill="#ffffff"/>
    <circle cx="240" cy="153" r="6" fill="#ffffff"/>
    <circle cx="159" cy="166" r="3" fill="#ffffff"/>
    <circle cx="249" cy="166" r="3" fill="#ffffff"/>
  </g>

  <!-- Nose -->
  <polygon points="200,190 189,198 211,198" fill="#ff8fa3"/>

  <!-- Mouth -->
  <path d="M 200 198 q -12 10 -20 8" fill="none" stroke="#8a4a2f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 200 198 q 12 10 20 8" fill="none" stroke="#8a4a2f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="200" y1="202" x2="200" y2="211" stroke="#8a4a2f" stroke-width="1.5"/>

  <!-- Whiskers -->
  <g stroke="#e6dcc5" stroke-width="2.5" stroke-linecap="round">
    <line x1="120" y1="195" x2="55" y2="188"/>
    <line x1="122" y1="203" x2="55" y2="208"/>
    <line x1="128" y1="212" x2="62" y2="226"/>
    <line x1="280" y1="195" x2="345" y2="188"/>
    <line x1="278" y1="203" x2="345" y2="208"/>
    <line x1="272" y1="212" x2="338" y2="226"/>
  </g>
</svg>