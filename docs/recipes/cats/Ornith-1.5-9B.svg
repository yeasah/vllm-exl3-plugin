<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#fff6ea"/>
      <stop offset="100%" stop-color="#ffd28f"/>
    </radialGradient>
    <linearGradient id="bodygrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb24d"/>
      <stop offset="100%" stop-color="#f38a2c"/>
    </linearGradient>
    <radialGradient id="iris" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#7fe3ff"/>
      <stop offset="70%" stop-color="#2ec2f0"/>
      <stop offset="100%" stop-color="#1b8fd6"/>
    </radialGradient>
  </defs>

  <!-- backdrop -->
  <rect width="400" height="400" rx="60" fill="url(#bg)"/>
  <!-- ground shadow -->
  <ellipse cx="200" cy="396" rx="118" ry="13" fill="#00000020"/>

  <!-- tail (behind body) -->
  <path d="M 322 300
           C 362 300 362 352 326 356
           C 306 358 300 332 292 322
           C 308 316 316 322 322 300 Z" fill="url(#bodygrad)"/>
  <g stroke="#d9761f" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M 332 324 q 12 4 16 18"/>
    <path d="M 320 334 q 14 4 20 22"/>
  </g>

  <!-- body -->
  <ellipse cx="200" cy="288" rx="148" ry="110" fill="url(#bodygrad)"/>
  <!-- belly -->
  <ellipse cx="200" cy="312" rx="88" ry="74" fill="#fff6ea"/>

  <!-- ears -->
  <path d="M 108 148 L 80 58 C 82 46 100 46 112 58 Z" fill="url(#bodygrad)"/>
  <path d="M 292 148 L 320 58 C 318 46 300 46 288 58 Z" fill="url(#bodygrad)"/>
  <path d="M 108 142 L 94 74 C 96 66 104 66 110 74 Z" fill="#ffc1d3"/>
  <path d="M 292 142 L 306 74 C 304 66 296 66 290 74 Z" fill="#ffc1d3"/>

  <!-- head -->
  <circle cx="200" cy="150" r="122" fill="url(#bodygrad)"/>

  <!-- forehead tabby stripes -->
  <g stroke="#c96a17" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M 182 96 Q 190 112 198 96"/>
    <path d="M 202 92 Q 210 108 218 92"/>
    <path d="M 222 96 Q 230 112 238 96"/>
  </g>

  <!-- blush -->
  <ellipse cx="128" cy="196" rx="24" ry="14" fill="#ffb3c6" opacity="0.55"/>
  <ellipse cx="272" cy="196" rx="24" ry="14" fill="#ffb3c6" opacity="0.55"/>

  <!-- eyes -->
  <g>
    <ellipse cx="152" cy="156" rx="32" ry="36" fill="#ffffff"/>
    <ellipse cx="248" cy="156" rx="32" ry="36" fill="#ffffff"/>
    <ellipse cx="152" cy="156" rx="23" ry="27" fill="url(#iris)"/>
    <ellipse cx="248" cy="156" rx="23" ry="27" fill="url(#iris)"/>
    <ellipse cx="155" cy="160" rx="13" ry="24" fill="#1a1a22"/>
    <ellipse cx="251" cy="160" rx="13" ry="24" fill="#1a1a22"/>
    <circle cx="142" cy="144" r="7" fill="#ffffff"/>
    <circle cx="158" cy="148" r="4" fill="#ffffff"/>
    <circle cx="242" cy="144" r="7" fill="#ffffff"/>
    <circle cx="258" cy="148" r="4" fill="#ffffff"/>
  </g>

  <!-- nose & mouth -->
  <polygon points="189,206 211,206 200,224" fill="#ff7aa2"/>
  <path d="M 200 224 L 200 238 Q 186 243 178 237 M 200 238 Q 214 243 222 237"
        fill="none" stroke="#3a3a44" stroke-width="3" stroke-linecap="round"/>

  <!-- whiskers -->
  <g stroke="#8a5a2b" stroke-width="2" stroke-linecap="round" opacity="0.75">
    <line x1="118" y1="206" x2="58" y2="198"/>
    <line x1="118" y1="214" x2="58" y2="214"/>
    <line x1="118" y1="222" x2="60" y2="232"/>
    <line x1="282" y1="206" x2="342" y2="198"/>
    <line x1="282" y1="214" x2="342" y2="214"/>
    <line x1="282" y1="222" x2="340" y2="232"/>
  </g>

  <!-- front paws -->
  <ellipse cx="172" cy="388" rx="24" ry="18" fill="#fff6ea"/>
  <ellipse cx="228" cy="388" rx="24" ry="18" fill="#fff6ea"/>
</svg>
