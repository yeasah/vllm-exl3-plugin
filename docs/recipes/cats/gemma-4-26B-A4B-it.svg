<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="200" cy="200" r="180" fill="#f0f8ff" />

  <!-- Ears -->
  <path d="M130 150 L100 80 L170 130 Z" fill="#ffb6c1" /> <!-- Left Ear -->
  <path d="M270 150 L300 80 L230 130 Z" fill="#ffb6c1" /> <!-- Right Ear -->
  
  <!-- Inner Ears -->
  <path d="M135 145 L115 100 L160 135 Z" fill="#ffc0cb" />
  <path d="M265 145 L285 100 L240 135 Z" fill="#ffc0cb" />

  <!-- Body/Head Shape -->
  <ellipse cx="200" cy="220" rx="100" ry="85" fill="#ffb6c1" />

  <!-- Cheeks -->
  <circle cx="140" cy="240" r="15" fill="#ffccd5" opacity="0.6" />
  <circle cx="260" cy="240" r="15" fill="#ffccd5" opacity="0.6" />

  <!-- Eyes -->
  <circle cx="160" cy="210" r="12" fill="#333" /> <!-- Left Eye -->
  <circle cx="240" cy="210" r="12" fill="#333" /> <!-- Right Eye -->
  
  <!-- Eye Highlights (Sparkle) -->
  <circle cx="164" cy="206" r="4" fill="white" />
  <circle cx="244" cy="206" r="4" fill="white" />

  <!-- Nose -->
  <path d="M195 230 L205 230 L200 238 Z" fill="#ff69b4" />

  <!-- Mouth -->
  <path d="M185 245 Q200 255 215 245" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round" />
  <path d="M185 245 Q200 235 215 245" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Whiskers -->
  <line x1="120" y1="235" x2="80" y2="230" stroke="#333" stroke-width="2" stroke-linecap="round" opacity="0.4" />
  <line x1="120" y1="245" x2="80" y2="250" stroke="#333" stroke-width="2" stroke-linecap="round" opacity="0.4" />
  
  <line x1="280" y1="235" x2="320" y2="230" stroke="#333" stroke-width="2" stroke-linecap="round" opacity="0.4" />
  <line x1="280" y1="245" x2="320" y2="250" stroke="#333" stroke-width="2" stroke-linecap="round" opacity="0.4" />
</svg>