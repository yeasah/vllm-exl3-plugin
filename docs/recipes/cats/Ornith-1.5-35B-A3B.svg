<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Background -->
  <rect width="400" height="400" fill="#fdebf2"/>

  <!-- Tail -->
  <path d="M 275 320 Q 360 320 348 235 Q 342 195 315 200"
        fill="none" stroke="#ff9fb8" stroke-width="20" stroke-linecap="round"/>

  <!-- Body -->
  <ellipse cx="200" cy="320" rx="75" ry="65" fill="#ffc0d0"/>

  <!-- Paws -->
  <ellipse cx="162" cy="368" rx="20" ry="14" fill="#ffe6ee"/>
  <ellipse cx="238" cy="368" rx="20" ry="14" fill="#ffe6ee"/>

  <!-- Head -->
  <circle cx="200" cy="175" r="82" fill="#ffc0d0"/>

  <!-- Ears -->
  <path d="M 140 120 L 108 45 L 178 92 Z" fill="#ffc0d0"/>
  <path d="M 260 120 L 292 45 L 222 92 Z" fill="#ffc0d0"/>
  <path d="M 143 112 L 122 66 L 166 95 Z" fill="#ff8fa3"/>
  <path d="M 257 112 L 278 66 L 234 95 Z" fill="#ff8fa3"/>

  <!-- Cheek blush -->
  <ellipse cx="140" cy="200" rx="20" ry="12" fill="#ff8fa3" opacity="0.4"/>
  <ellipse cx="260" cy="200" rx="20" ry="12" fill="#ff8fa3" opacity="0.4"/>

  <!-- Eyes -->
  <circle cx="168" cy="175" r="26" fill="#ffffff"/>
  <circle cx="232" cy="175" r="26" fill="#ffffff"/>
  <circle cx="170" cy="177" r="18" fill="#3a2d2b"/>
  <circle cx="234" cy="177" r="18" fill="#3a2d2b"/>
  <circle cx="164" cy="171" r="6" fill="#ffffff"/>
  <circle cx="228" cy="171" r="6" fill="#ffffff"/>
  <circle cx="176" cy="183" r="3" fill="#ffffff"/>
  <circle cx="240" cy="183" r="3" fill="#ffffff"/>

  <!-- Nose -->
  <path d="M 190 205 L 210 205 L 200 218 Z" fill="#ff6b81"/>

  <!-- Mouth -->
  <path d="M 200 218 Q 190 230 178 225" fill="none" stroke="#ff6b81" stroke-width="3" stroke-linecap="round"/>
  <path d="M 200 218 Q 210 230 222 225" fill="none" stroke="#ff6b81" stroke-width="3" stroke-linecap="round"/>

  <!-- Whiskers -->
  <path d="M 150 210 L 95 200 M 150 220 L 95 225 M 250 210 L 305 200 M 250 220 L 305 225"
        stroke="#d98aa0" stroke-width="2" stroke-linecap="round"/>

  <!-- Head stripes -->
  <path d="M 200 95 L 200 120" stroke="#ff8fa3" stroke-width="5" stroke-linecap="round"/>
  <path d="M 178 98 L 182 122" stroke="#ff8fa3" stroke-width="5" stroke-linecap="round"/>
  <path d="M 222 98 L 218 122" stroke="#ff8fa3" stroke-width="5" stroke-linecap="round"/>
</svg>