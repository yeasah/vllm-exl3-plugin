<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Cat body -->
  <ellipse cx="200" cy="300" rx="100" ry="80" fill="#f4a460"/>
  
  <!-- Head -->
  <circle cx="200" cy="180" r="70" fill="#e6b8b8"/>
  
  <!-- Ears -->
  <path d="M130 115 Q 160 95 190 105" fill="none" stroke="#e6b8b8" stroke-width="20" stroke-linecap="round"/>
  <path d="M230 115 Q 240 95 260 105" fill="none" stroke="#e6b8b8" stroke-width="20" stroke-linecap="round"/>
  
  <!-- Eyes -->
  <circle cx="185" cy="165" r="9" fill="#333"/>
  <circle cx="215" cy="165" r="9" fill="#333"/>
  <circle cx="185" cy="165" r="4" fill="#fff"/>
  <circle cx="215" cy="165" r="4" fill="#fff"/>
  
  <!-- Nose -->
  <ellipse cx="200" cy="195" rx="12" ry="7" fill="#e6b8b8"/>
  
  <!-- Mouth -->
  <path d="M185 210 Q 200 225 215 210" fill="none" stroke="#333" stroke-width="2"/>
  
  <!-- Whiskers -->
  <line x1="190" y1="175" x2="190" y2="145" stroke="#333" stroke-width="2"/>
  <line x1="210" y1="175" x2="210" y2="145" stroke="#333" stroke-width="2"/>
  
  <!-- Tail -->
  <path d="M340 310 Q 370 320 390 300" fill="none" stroke="#e6b8b8" stroke-width="15" stroke-linecap="round"/>
</svg>