<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <rect width="200" height="200" fill="#f9f9f9"/>
  
  <!-- Body -->
  <ellipse cx="100" cy="150" rx="32" ry="38" fill="#a8d5ba"/>
  
  <!-- Belly -->
  <ellipse cx="100" cy="158" rx="16" ry="20" fill="#ffeb3b"/>
  
  <!-- Head -->
  <circle cx="100" cy="72" r="24" fill="#ffffff"/>
  
  <!-- Left Ear -->
  <polygon points="58,68 48,42 62,12" fill="#ffb6c1"/>
  <!-- Right Ear -->
  <polygon points="142,68 134,42 156,12" fill="#ffb6c1"/>
  
  <!-- Nose -->
  <ellipse cx="100" cy="86" rx="4" ry="2" fill="#111111"/>
  
  <!-- Eyes -->
  <circle cx="92" cy="74" r="3" fill="#222222"/>
  <circle cx="108" cy="74" r="3" fill="#222222"/>
  <circle cx="94" cy="73" r="1.5" fill="white"/>
  <circle cx="106" cy="73" r="1.5" fill="white"/>
  
  <!-- Mouth -->
  <path d="M 96 90 Q 100 94 104 90" fill="none" stroke="#444" stroke-width="1.5"/>
  
  <!-- Tail -->
  <path d="M 112 132 Q 118 152 103 162 Q 98 168 93 166 Z" fill="#ffb6c1"/>
</svg>
