services:
  vllm-exl3-serve:
    image: yeasah/vllm-exl3-serve:latest
    ports:
      - ${HOST_PORT:-8000}:8000
    environment:
      - HF_TOKEN=${HF_TOKEN}
    command: --config /root/vllm_config.yml
    volumes:
      - ./vllm_config.yml:/root/vllm_config.yml
      - ~/.cache/huggingface:/root/.cache/huggingface
      - vllm-exl3-serve-cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  vllm-exl3-serve-cache:
