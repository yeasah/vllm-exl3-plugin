# Bench for a 2x 16GiB 5060ti system with enough RAM to support 24GiB offload

# the difference (in MiB) between the total space reported by nvml and what vllm reports at startup (and scales utilization against)
mysterious_bullshit: 418.52

tests:

######################### MoE models

- model: turboderp/gemma-4-26B-A4B-it-exl3
  host_ram: 8
  revision: 4.10bpw
  vllm_args:
    kv_cache_dtype: fp8
  vram: 15.5

- model: turboderp/Laguna-XS-2.1-exl3
  host_ram: 16
  revision: 4.00bpw
  vram: 15.5

- model: yeasah/Ornith-1.5-35B-A3B-exl3
  host_ram: 16
  revision: 4.00bpw
  vram: 15.5

- model: yeasah/Qwen3.6-35B-A3B-exl3
  host_ram: 16
  revision: 4.00bpw
  vram: 15.5

- model: yeasah/Qwen3.6-35B-A3B-exl3
  host_ram: 16
  revision: 4.00bpw
  suffix: MTP
  vllm_args:
    speculative_config:
      method: mtp
      num_speculative_tokens: 2
      revision: 4.00bpw
  vram: 15.5

- model: turboderp/Qwen3.8-Flash-Next-exl3
  env:
    EXL3_NGRAM_REVISION: 2.18bpw_h6_ng8
  host_ram: 24
  revision: 1.66bpw_h4_ng3
  suffix: v15-h24
  vllm_args:
    attention_config:
      indexer_kv_dtype: fp8
    kv_cache_dtype: fp8
  vram: 15.5

- model: turboderp/Qwen3.8-Flash-Next-exl3
  host_ram: 24
  revision: 2.18bpw_h6_ng8
  suffix: v30-h24
  vllm_args:
    attention_config:
      indexer_kv_dtype: fp8
    kv_cache_dtype: fp8
  vram: 31

